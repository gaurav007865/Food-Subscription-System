<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>TiffinHub - Delivery Partner</title>

    <!-- Your existing global.js contains API_URL -->
    <script src="global.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AlzaSyCmL9pi8STSs0gHLVesV2zUo0EIW2FMi2k&libraries=geometry" async defer>
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #ff6b35;
            --primary-dark: #e85a26;
            --blue: #2563eb;
            --green: #16a34a;
            --dark: #111827;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --surface: #ffffff;
            --page: #f5f7fb;
            --soft: #f8fafc;
            --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Arial, sans-serif;
            background: var(--page);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.45;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
   LOGIN
========================= */

        #login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;

            background:
                radial-gradient(circle at top left,
                    rgba(255, 107, 53, 0.12),
                    transparent 35%),
                linear-gradient(135deg, #fff8f4, #f5f7fb);
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            background: white;
            border: 1px solid rgba(229, 231, 235, 0.9);

            border-radius: 24px;
            padding: 32px;

            box-shadow: var(--shadow-md);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 68px;
            height: 68px;

            margin: 0 auto 12px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;

            background: #fff1eb;
        }

        .brand h1 {
            font-size: 29px;
            color: var(--primary);

            margin-bottom: 5px;

            letter-spacing: -0.5px;
        }

        .brand p {
            color: var(--muted);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d8dde7;
            border-radius: 11px;

            outline: none;

            background: white;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(255, 107, 53, 0.10);
        }

        .primary-btn {
            width: 100%;

            border: none;

            background: var(--primary);
            color: white;

            padding: 14px;

            border-radius: 11px;

            font-weight: 750;

            cursor: pointer;

            transition: 0.2s;
        }

        .primary-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            margin-bottom: 15px;

            padding: 11px 12px;

            background: #fff0f0;
            color: #c62828;

            border-radius: 10px;

            font-size: 14px;

            display: none;
        }

        /* =========================
   DASHBOARD
========================= */

        #dashboard-page {
            min-height: 100vh;
        }

        .topbar {
            background: rgba(255, 255, 255, 0.96);

            border-bottom: 1px solid var(--border);

            padding: 13px 20px;

            position: sticky;
            top: 0;

            z-index: 100;

            backdrop-filter: blur(12px);
        }

        .topbar-inner {
            max-width: 1180px;

            margin: auto;

            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .topbar-brand {
            font-size: 22px;

            font-weight: 850;

            color: var(--primary);

            letter-spacing: -0.4px;
        }

        .delivery-boy-info {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;

            flex: 0 0 40px;

            border-radius: 50%;

            background: #fff0e9;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 19px;
        }

        .boy-name {
            font-weight: 750;
            font-size: 14px;
        }

        .boy-id {
            color: var(--muted);
            font-size: 12px;

            margin-top: 1px;
        }

        .logout-btn {
            border: 1px solid var(--border);

            background: white;
            color: #374151;

            padding: 9px 13px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: 650;

            transition: 0.2s;
        }

        .logout-btn:hover {
            background: #f3f4f6;
        }

        /* =========================
   MAIN CONTAINER
========================= */

        .container {
            max-width: 1180px;

            margin: auto;

            padding: 28px 20px 60px;
        }

        .welcome-card {
            background:
                linear-gradient(135deg,
                    #ff6b35,
                    #ff865d);

            color: white;

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 24px;

            box-shadow:
                0 12px 28px rgba(255, 107, 53, 0.16);
        }

        .welcome-card h2 {
            font-size: 23px;

            margin-bottom: 6px;

            letter-spacing: -0.3px;
        }

        .welcome-card p {
            opacity: 0.92;

            font-size: 14px;
        }

        .refresh-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 14px;

            margin-bottom: 13px;
        }

        .refresh-btn {
            border: 1px solid var(--border);

            background: white;

            padding: 9px 13px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: 650;

            color: #374151;

            transition: 0.2s;
        }

        .refresh-btn:hover {
            background: #f8fafc;
        }

        .section-title {
            font-size: 20px;

            font-weight: 850;

            margin-bottom: 14px;

            letter-spacing: -0.3px;
        }

        /* =========================
   ORDERS
========================= */

        .orders-container {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;

            align-items: start;
        }

        /* Every order gets its own card */
        .order-card {
            position: relative;

            min-width: 0;

            background: white;

            border: 1px solid #e4e8ef;

            border-radius: 18px;

            padding: 20px;

            box-shadow: var(--shadow-sm);

            overflow: hidden;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                border-color 0.2s;
        }

        .order-card:hover {
            transform: translateY(-2px);

            box-shadow: var(--shadow-md);

            border-color: #d8dde7;
        }

        /* Orange indicator */
        .order-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 4px;

            background: var(--primary);
        }

        .order-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 14px;

            margin-bottom: 16px;

            padding-left: 4px;
        }

        .order-id {
            font-size: 17px;

            font-weight: 850;

            color: var(--dark);

            overflow-wrap: anywhere;
        }

        .status-badge {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 6px 10px;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 800;

            white-space: nowrap;

            line-height: 1.1;
        }

        .status-assigned {
            background: #fff4d6;
            color: #946200;
        }

        .status-accepted {
            background: #e8f3ff;
            color: #1769aa;
        }

        .status-delivery {
            background: #e7f8ef;
            color: #087443;
        }

        .status-delivered {
            background: #dcfce7;
            color: #166534;
        }

        /* =========================
   ORDER INFORMATION
========================= */

        .order-info {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 9px;

            margin-bottom: 15px;
        }

        .info-row {
            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 3px;

            padding: 10px 11px;

            background: var(--soft);

            border: 1px solid #edf0f4;

            border-radius: 10px;

            font-size: 13px;
        }

        .info-label {
            color: var(--muted);

            font-size: 11px;

            font-weight: 600;
        }

        .info-value {
            font-weight: 750;

            color: #273244;

            overflow-wrap: anywhere;
        }

        /* =========================
   ADDRESS
========================= */

        .address-box {
            margin-top: 12px;

            padding: 13px 14px;

            background: #f8fafc;

            border: 1px solid #edf0f4;

            border-radius: 11px;

            font-size: 13px;

            line-height: 1.55;

            overflow-wrap: anywhere;
        }

        .address-title {
            font-weight: 800;

            margin-bottom: 5px;

            color: #374151;
        }

        /* =========================
   ACTION BUTTONS
========================= */

        .action-buttons {
            display: grid;

            grid-template-columns: 1fr;

            gap: 9px;

            margin-top: 16px;
        }

        .action-btn {
            width: 100%;

            min-height: 44px;

            border: none;

            padding: 11px 13px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 750;

            transition: 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-1px);

            filter: brightness(0.98);
        }

        .action-btn:disabled {
            opacity: 0.55;

            cursor: not-allowed;

            transform: none;
        }

        .btn-accept {
            background: var(--primary);
            color: white;
        }

        .btn-start {
            background: var(--blue);
            color: white;
        }

        .btn-location {
            background: #0f9d58;
            color: white;
        }

        .btn-map {
            background: #111827;
            color: white;
        }

        .btn-delivered {
            background: var(--green);
            color: white;
        }

        /* =========================
   LIVE TRACKING
========================= */

        .live-tracking-box {
            margin-top: 15px;

            padding: 15px;

            background: #f8fafc;

            border: 1px solid #e3e8ef;

            border-radius: 13px;
        }

        .live-tracking-title {
            font-weight: 850;

            margin-bottom: 9px;

            font-size: 14px;
        }

        .tracking-status {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 12px;

            font-size: 12px;

            font-weight: 750;
        }

        .tracking-dot {
            width: 9px;
            height: 9px;

            background: #16a34a;

            border-radius: 50%;

            display: inline-block;

            box-shadow:
                0 0 0 4px rgba(22, 163, 74, 0.10);
        }

        .location-active {
            color: #087443;
        }

        .tracking-info {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 8px;
        }

        .tracking-info-item {
            min-width: 0;

            background: white;

            padding: 10px;

            border-radius: 9px;

            border: 1px solid #edf0f3;
        }

        .tracking-info-label {
            display: block;

            color: #6b7280;

            font-size: 10px;

            margin-bottom: 3px;
        }

        .tracking-info-value {
            font-weight: 800;

            font-size: 13px;

            overflow-wrap: anywhere;
        }

        .eta-highlight {
            color: #087443;
        }

        .map-preview {
            margin-top: 12px;

            height: 190px;

            border-radius: 11px;

            background:
                linear-gradient(135deg,
                    #eef7f0,
                    #eef5ff);

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            border: 1px solid #dce5df;

            color: #374151;

            font-size: 13px;

            padding: 20px;
        }

        /* =========================
   EMPTY / LOADING
========================= */

        .empty-state {
            grid-column: 1 / -1;

            background: white;

            padding: 48px 20px;

            border-radius: 18px;

            text-align: center;

            color: var(--muted);

            border: 1px solid var(--border);

            box-shadow: var(--shadow-sm);
        }

        .empty-icon {
            font-size: 42px;

            margin-bottom: 12px;
        }

        .loading {
            grid-column: 1 / -1;

            text-align: center;

            padding: 40px;

            color: var(--muted);

            background: white;

            border: 1px solid var(--border);

            border-radius: 18px;
        }

        .spinner {
            width: 30px;
            height: 30px;

            border: 3px solid #eee;

            border-top-color: var(--primary);

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin: 0 auto 12px;
        }

        .map-preview {
    margin-top: 12px;
    height: 190px;
    border-radius: 11px;
    overflow: hidden;
}

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
   TOAST
========================= */

        #toast {
            position: fixed;

            left: 50%;
            bottom: 22px;

            transform: translateX(-50%);

            background: #111827;

            color: white;

            padding: 12px 18px;

            border-radius: 11px;

            font-size: 14px;

            z-index: 9999;

            display: none;

            max-width: min(90%, 520px);

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.18);
        }

        /* =========================
   TABLET
========================= */

        @media (max-width: 800px) {

            .orders-container {
                grid-template-columns: 1fr;
            }
        }

        /* =========================
   MOBILE
========================= */

        @media (max-width: 600px) {

            #login-page {
                padding: 16px;
            }

            .login-card {
                padding: 24px;

                border-radius: 20px;
            }

            .topbar {
                padding: 11px 13px;
            }

            .topbar-brand {
                font-size: 19px;
            }

            .boy-name {
                display: none;
            }

            .container {
                padding: 18px 13px 42px;
            }

            .welcome-card {
                padding: 19px;

                border-radius: 16px;

                margin-bottom: 19px;
            }

            .welcome-card h2 {
                font-size: 20px;
            }

            .section-title {
                font-size: 18px;
            }

            .order-card {
                padding: 17px;

                border-radius: 16px;
            }

            .order-header {
                align-items: flex-start;
            }

            .order-info {
                grid-template-columns: 1fr 1fr;
            }

            .tracking-info {
                grid-template-columns: 1fr 1fr;
            }

            .map-preview {
                height: 170px;
            }
        }

        /* Small phones */

        @media (max-width: 390px) {

            .order-info,
            .tracking-info {
                grid-template-columns: 1fr;
            }

            .logout-btn {
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
       LOGIN PAGE
  ========================================================== -->

    <section id="login-page">

        <div class="login-card">

            <div class="brand">

                <div class="brand-icon">🚚</div>

                <h1>TiffinHub</h1>

                <p>Delivery Partner Login</p>

            </div>

            <div id="login-error" class="error-message"></div>

            <div class="input-group">

                <label for="delivery-boy-id">
                    Delivery Boy ID
                </label>

                <input type="text" id="delivery-boy-id" class="input-field" placeholder="Example: DB001"
                    autocomplete="username">

            </div>

            <div class="input-group">

                <label for="delivery-password">
                    Password
                </label>

                <input type="password" id="delivery-password" class="input-field" placeholder="Enter password"
                    autocomplete="current-password">

            </div>

            <button id="login-btn" class="primary-btn" onclick="loginDeliveryBoy()">
                Login
            </button>

        </div>

    </section>


    <!-- =========================================================
       DASHBOARD
  ========================================================== -->

    <section id="dashboard-page" class="hidden">

        <header class="topbar">

            <div class="topbar-inner">

                <div class="topbar-brand">
                    🍱 TiffinHub
                </div>

                <div class="delivery-boy-info">

                    <div class="avatar">
                        🚚
                    </div>

                    <div>

                        <div id="boy-name" class="boy-name">
                            Delivery Boy
                        </div>

                        <div id="boy-id" class="boy-id">
                            DB001
                        </div>

                    </div>

                    <button class="logout-btn" onclick="logoutDeliveryBoy()">
                        Logout
                    </button>

                </div>

            </div>

        </header>


        <main class="container">

            <div class="welcome-card">

                <h2>
                    Welcome, <span id="welcome-name">Delivery Partner</span> 👋
                </h2>

                <p>
                    Manage your assigned Tiffin deliveries from here.
                </p>

            </div>


            <div class="refresh-row">

                <button class="refresh-btn" onclick="loadAssignedOrders()">
                    🔄 Refresh Orders
                </button>

            </div>


            <div class="section-title">
                Assigned Orders
            </div>


            <div id="orders-container">

                <div class="loading">

                    <div class="spinner"></div>

                    Loading orders...

                </div>

            </div>

        </main>

    </section>


    <!-- Toast -->

    <div id="toast"></div>


    <script>

        /* =========================================================
           GLOBAL STATE
        ========================================================== */

        let currentDeliveryBoy = null;

        let assignedOrders = [];

        let locationWatchId = null;

        let activeLocationOrderId = null;

        let locationUpdateBusy = false;


        /*
          API_URL is expected from global.js.
    
          If global.js already defines:
    
          const API_URL = "...";
    
          this page will automatically use it.
        */

        const DELIVERY_API_URL =
            typeof API_URL !== "undefined"
                ? API_URL
                : "";


        /* =========================================================
           INITIAL LOAD
        ========================================================== */

        document.addEventListener("DOMContentLoaded", function () {

            const savedBoy =
                localStorage.getItem("tiffinhub_delivery_boy");

            if (savedBoy) {

                try {

                    currentDeliveryBoy =
                        JSON.parse(savedBoy);

                    if (
                        currentDeliveryBoy &&
                        currentDeliveryBoy.deliveryBoyId
                    ) {

                        showDashboard();

                    }

                } catch (err) {

                    console.error(
                        "Saved delivery login error:",
                        err
                    );

                    localStorage.removeItem(
                        "tiffinhub_delivery_boy"
                    );

                }

            }

        });


        /* =========================================================
           API HELPER
        ========================================================== */

        async function callAPI(payload) {

            if (!DELIVERY_API_URL) {

                throw new Error(
                    "API_URL is not defined. Check global.js."
                );

            }

            const response = await fetch(
                DELIVERY_API_URL,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(payload)
                }
            );

            if (!response.ok) {

                throw new Error(
                    "Server returned HTTP " +
                    response.status
                );

            }

            return await response.json();

        }


        /* =========================================================
           LOGIN
        ========================================================== */

        async function loginDeliveryBoy() {

            const idInput =
                document.getElementById(
                    "delivery-boy-id"
                );

            const passwordInput =
                document.getElementById(
                    "delivery-password"
                );

            const loginBtn =
                document.getElementById(
                    "login-btn"
                );

            const errorBox =
                document.getElementById(
                    "login-error"
                );


            const deliveryBoyId =
                idInput.value.trim();

            const password =
                passwordInput.value.trim();


            errorBox.style.display = "none";


            if (!deliveryBoyId || !password) {

                showLoginError(
                    "Please enter Delivery Boy ID and password."
                );

                return;

            }


            loginBtn.disabled = true;

            loginBtn.innerText =
                "Logging in...";


            try {

                const result =
                    await callAPI({

                        action:
                            "deliveryBoyLogin",

                        deliveryBoyId:
                            deliveryBoyId,

                        password:
                            password

                    });


                if (!result.success) {

                    showLoginError(
                        result.message ||
                        "Invalid login details."
                    );

                    return;

                }


                currentDeliveryBoy =
                    result.deliveryBoy;


                localStorage.setItem(
                    "tiffinhub_delivery_boy",
                    JSON.stringify(
                        currentDeliveryBoy
                    )
                );


                showDashboard();


            } catch (err) {

                console.error(
                    "Delivery login error:",
                    err
                );

                showLoginError(
                    "Unable to connect to server. Please try again."
                );

            } finally {

                loginBtn.disabled = false;

                loginBtn.innerText =
                    "Login";

            }

        }


        function showLoginError(message) {

            const errorBox =
                document.getElementById(
                    "login-error"
                );

            errorBox.innerText =
                message;

            errorBox.style.display =
                "block";

        }


        /* =========================================================
           DASHBOARD
        ========================================================== */

        function showDashboard() {

            if (
                !currentDeliveryBoy ||
                !currentDeliveryBoy.deliveryBoyId
            ) {

                return;

            }


            document
                .getElementById("login-page")
                .classList.add("hidden");


            document
                .getElementById("dashboard-page")
                .classList.remove("hidden");


            document.getElementById(
                "boy-name"
            ).innerText =
                currentDeliveryBoy.name ||
                "Delivery Partner";


            document.getElementById(
                "boy-id"
            ).innerText =
                currentDeliveryBoy.deliveryBoyId;


            document.getElementById(
                "welcome-name"
            ).innerText =
                currentDeliveryBoy.name ||
                "Delivery Partner";


            loadAssignedOrders();

        }


        /* =========================================================
           LOAD ASSIGNED ORDERS
        ========================================================== */

        async function loadAssignedOrders(silent = false) {

            const container =
                document.getElementById("orders-container");

            // Show loading only on first/manual load
            if (!silent) {

                container.innerHTML = `

            <div class="loading">

                <div class="spinner"></div>

                Loading orders...

            </div>

        `;
            }

            try {

                const result =
                    await callAPI({

                        action:
                            "getDeliveryBoyOrders",

                        deliveryBoyId:
                            currentDeliveryBoy.deliveryBoyId

                    });


                if (!result.success) {

                    // Don't destroy existing orders during silent refresh
                    if (silent && assignedOrders.length > 0) {
                        console.warn(
                            "Background order refresh failed:",
                            result.message
                        );
                        return;
                    }

                    container.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <p>
                        ${escapeHtml(
                        result.message ||
                        "Unable to load orders."
                    )}
                    </p>

                </div>

            `;

                    return;
                }


                assignedOrders =
                    result.orders || [];


                renderOrders(
                    assignedOrders
                );


            } catch (err) {

                console.error(
                    "Load orders error:",
                    err
                );


                // During background refresh,
                // keep the current screen unchanged
                if (silent && assignedOrders.length > 0) {

                    console.warn(
                        "Background refresh failed."
                    );

                    return;
                }


                container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    ⚠️
                </div>

                <p>
                    Unable to load orders.
                </p>

                <br>

                <button
                    class="refresh-btn"
                    onclick="loadAssignedOrders()"
                >
                    Try Again
                </button>

            </div>

        `;

            }

        }

        /* =========================================================
           RENDER ORDERS
        ========================================================== */

        function renderOrders(orders) {

            const container =
                document.getElementById(
                    "orders-container"
                );


            if (!orders || !orders.length) {

                container.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              📦
            </div>

            <h3 style="margin-bottom:8px;">
              No Assigned Orders
            </h3>

            <p>
              New orders assigned to you
              will appear here.
            </p>

          </div>

        `;

                return;

            }


            container.innerHTML =
    orders.map(
        order => createOrderCard(order)
    ).join("");

orders.forEach(order => {

    if (
        String(order.DeliveryStatus || "")
            .toUpperCase() === "OUT FOR DELIVERY"
    ) {

        setTimeout(() => {

            initializeOrderMap(
                order.OrderID
            );

        }, 100);

    }

});

            

        }


        /* =========================================================
           ORDER CARD
        ========================================================== */

        function createOrderCard(order) {

            const orderId =
                order.OrderID || "";

            const amount =
                order.Amount || 0;

            const paymentStatus =
                order.PaymentStatus || "-";

            const orderStatus =
                order.OrderStatus || "-";

            const deliveryStatus =
                order.DeliveryStatus || "";


            let statusText =
                deliveryStatus ||
                orderStatus;


            let statusClass =
                "status-assigned";


            if (
                statusText === "Accepted"
            ) {

                statusClass =
                    "status-accepted";

            }

            if (
                statusText === "Out for Delivery"
            ) {

                statusClass =
                    "status-delivery";

            }

            if (
                statusText === "Delivered"
            ) {

                statusClass =
                    "status-delivered";

            }


            const address =
                getOrderAddress(order);


            const hasCoordinates =
                getOrderLatitude(order) !== null &&
                getOrderLongitude(order) !== null;


            return `

        <div
          class="order-card"
          id="order-card-${safeId(orderId)}"
        >

          <div class="order-header">

            <div class="order-id">
              ${escapeHtml(orderId)}
            </div>

            <span
              class="status-badge ${statusClass}"
            >
              ${escapeHtml(statusText)}
            </span>

          </div>


          <div class="order-info">

            <div class="info-row">

              <span class="info-label">
                Amount
              </span>

              <span class="info-value">
                ₹${escapeHtml(
                String(amount)
            )}
              </span>

            </div>


            <div class="info-row">

              <span class="info-label">
                Payment
              </span>

              <span class="info-value">
                ${escapeHtml(
                String(paymentStatus)
            )}
              </span>

            </div>


            <div class="info-row">

              <span class="info-label">
                Tiffin ID
              </span>

              <span class="info-value">
                ${escapeHtml(
                String(
                    order.TiffinID || "-"
                )
            )}
              </span>

            </div>


            <div class="info-row">

              <span class="info-label">
                Assigned
              </span>

              <span class="info-value">
                ${formatDate(
                order.AssignedAt
            )}
              </span>

            </div>

          </div>
${deliveryStatus === "Out for Delivery" ? `
  <div class="live-tracking-box">

    <div class="live-tracking-title">
      🚚 Live Delivery Tracking
    </div>

    <div class="tracking-status">
      <span class="tracking-dot"></span>
      <span class="location-active">
        Delivery is in progress
      </span>
    </div>

    <div class="tracking-info">

      <div class="tracking-info-item">
        <span class="tracking-info-label">
          📍 Customer
        </span>

        <span class="tracking-info-value">
          ${address ? "Location Available" : "Address Pending"}
        </span>
      </div>

      <div class="tracking-info-item">
        <span class="tracking-info-label">
          🛵 Your Status
        </span>

        <span class="tracking-info-value">
          On the way
        </span>
      </div>

      <div class="tracking-info-item">
        <span class="tracking-info-label">
          📏 Distance
        </span>

        <span
          class="tracking-info-value"
          id="distance-${safeId(orderId)}"
        >
          Calculating...
        </span>
      </div>

      <div class="tracking-info-item">
        <span class="tracking-info-label">
          ⏱️ Expected Time
        </span>

        <span
          class="tracking-info-value eta-highlight"
          id="eta-${safeId(orderId)}"
        >
          Calculating...
        </span>
      </div>

    </div>

    <div
    class="map-preview"
    id="map-${safeId(orderId)}">
</div>

  </div>
` : ""}

          <div class="address-box">

            <div class="address-title">
              📍 Customer Address
            </div>

            <div>
              ${escapeHtml(
                address ||
                "Customer address not available yet."
            )}
            </div>

          </div>


          <div class="action-buttons">

            ${renderOrderActions(
                order,
                address,
                hasCoordinates
            )}

          </div>

        </div>

      `;

        }


        /* =========================================================
           ORDER ACTIONS
        ========================================================== */

        function renderOrderActions(order, address, hasCoordinates) {

            const orderId = String(order.OrderID || "");

            // Backend se ASSIGNED / Accepted / Out for Delivery / Delivered
            const deliveryStatus =
                String(order.DeliveryStatus || "")
                    .trim()
                    .toUpperCase();

            let html = "";

            // =========================================
            // STEP 1: ASSIGNED
            // =========================================
            if (
                deliveryStatus === "" ||
                deliveryStatus === "ASSIGNED"
            ) {

                html += `
            <button
                class="action-btn btn-accept"
                onclick="acceptOrder('${escapeAttr(orderId)}')"
            >
                ✅ Accept Order
            </button>
        `;
            }

            // =========================================
            // STEP 2: ACCEPTED
            // =========================================
            else if (deliveryStatus === "ACCEPTED") {

                html += `
            <button
                class="action-btn btn-start"
                onclick="startDelivery('${escapeAttr(orderId)}')"
            >
                🚚 Start Delivery
            </button>
        `;
            }

            // =========================================
            // STEP 3: OUT FOR DELIVERY
            // =========================================
            else if (deliveryStatus === "OUT FOR DELIVERY") {

                html += `
            <button
                class="action-btn btn-location"
                onclick="startLocationTracking('${escapeAttr(orderId)}')"
            >
                📍 Share Live Location
            </button>

            <button
                class="action-btn btn-map"
                onclick="openGoogleMaps('${escapeAttr(orderId)}')"
            >
                🗺️ Navigate to Customer
            </button>

            <button
                class="action-btn btn-delivered"
                onclick="completeOrder('${escapeAttr(orderId)}')"
            >
                ✅ Mark Delivered
            </button>
        `;
            }

            // =========================================
            // STEP 4: DELIVERED
            // =========================================
            else if (deliveryStatus === "DELIVERED") {

                html += `
            <div
                style="
                    text-align:center;
                    color:#087443;
                    font-weight:800;
                    padding:8px;
                "
            >
                ✅ Delivery Completed
            </div>
        `;
            }

            return html;
        }


        /* =========================================================
           ACCEPT ORDER
        ========================================================== */

        async function acceptOrder(orderId) {

            if (
                !confirm(
                    "Accept this delivery order?"
                )
            ) {

                return;

            }


            showToast(
                "Accepting order..."
            );


            try {

                const result =
                    await callAPI({

                        action:
                            "acceptDeliveryOrder",

                        orderId:
                            orderId,

                        deliveryBoyId:
                            currentDeliveryBoy.deliveryBoyId

                    });


                showToast(
                    result.message ||
                    "Order updated."
                );


                if (result.success) {

                    await loadAssignedOrders();

                }


            } catch (err) {

                console.error(
                    "Accept order error:",
                    err
                );

                showToast(
                    "Unable to accept order."
                );

            }

        }


        /* =========================================================
           START DELIVERY
        ========================================================== */

        async function startDelivery(orderId) {

            if (
                !confirm(
                    "Start delivery for this order?"
                )
            ) {

                return;

            }


            showToast(
                "Starting delivery..."
            );


            try {

                const result =
                    await callAPI({

                        action:
                            "startDelivery",

                        orderId:
                            orderId,

                        deliveryBoyId:
                            currentDeliveryBoy.deliveryBoyId

                    });


                showToast(
                    result.message ||
                    "Delivery started."
                );


                if (result.success) {

                    await loadAssignedOrders();

                    /*
                      Automatically request
                      location permission.
                    */

                    startLocationTracking(
                        orderId
                    );

                }


            } catch (err) {

                console.error(
                    "Start delivery error:",
                    err
                );

                showToast(
                    "Unable to start delivery."
                );

            }

        }


        /* =========================================================
           GPS LOCATION
        ========================================================== */

        function startLocationTracking(orderId) {

            if (
                !navigator.geolocation
            ) {

                showToast(
                    "GPS is not supported on this device."
                );

                return;

            }


            activeLocationOrderId =
                orderId;


            /*
              This will trigger the browser's
              location permission popup.
            */

            showToast(
                "Please allow location permission."
            );


            if (
                locationWatchId !== null
            ) {

                navigator.geolocation.clearWatch(
                    locationWatchId
                );

            }


            locationWatchId =
                navigator.geolocation.watchPosition(

                    function (position) {

                        const latitude =
                            position.coords.latitude;

                        const longitude =
                            position.coords.longitude;


                        updateLocationOnServer(
                            orderId,
                            latitude,
                            longitude
                        );

                    },

                    function (error) {

                        console.error(
                            "GPS error:",
                            error
                        );


                        if (
                            error.code === 1
                        ) {

                            showToast(
                                "Location permission denied."
                            );

                        } else if (
                            error.code === 2
                        ) {

                            showToast(
                                "Unable to detect your location."
                            );

                        } else {

                            showToast(
                                "Location error occurred."
                            );

                        }

                    },

                    {
                        enableHighAccuracy: true,
                        maximumAge: 5000,
                        timeout: 15000
                    }

                );

        }


        async function updateLocationOnServer(
            orderId,
            latitude,
            longitude
        ) {

            /*
              Prevent multiple API requests
              at exactly the same time.
            */

            if (locationUpdateBusy) {

                return;

            }


            locationUpdateBusy = true;


            try {

                const result =
                    await callAPI({

                        action:
                            "updateDeliveryLocation",

                        orderId:
                            orderId,

                        deliveryBoyId:
                            currentDeliveryBoy.deliveryBoyId,

                        latitude:
                            latitude,

                        longitude:
                            longitude

                    });


                if (!result.success) {

                    console.error(
                        "Location update failed:",
                        result.message
                    );

                }

            } catch (err) {

                console.error(
                    "Location API error:",
                    err
                );

            } finally {

                locationUpdateBusy = false;

            }

        }

        function initializeOrderMap(orderId) {

    const order = assignedOrders.find(
        o => String(o.OrderID) === String(orderId)
    );

    if (!order) {
        return;
    }

    const latitude =
        getOrderLatitude(order);

    const longitude =
        getOrderLongitude(order);

    if (
        latitude === null ||
        longitude === null
    ) {
        return;
    }

    const mapElement =
        document.getElementById(
            "map-" + safeId(orderId)
        );

    if (!mapElement) {
        return;
    }

    const customerLocation = {
        lat: latitude,
        lng: longitude
    };

    const map = new google.maps.Map(
        mapElement,
        {
            center: customerLocation,
            zoom: 15,
            mapTypeControl: false,
            streetViewControl: false,
            fullscreenControl: true
        }
    );

    new google.maps.Marker({
        position: customerLocation,
        map: map,
        title: "Customer Location"
    });

}

        /* =========================================================
           GOOGLE MAPS
        ========================================================== */

        function openGoogleMaps(orderId) {

            const order =
                assignedOrders.find(
                    o =>
                        String(o.OrderID) ===
                        String(orderId)
                );


            if (!order) {

                showToast(
                    "Order not found."
                );

                return;

            }


            const lat =
                getOrderLatitude(order);

            const lng =
                getOrderLongitude(order);


            /*
              First priority:
              Customer latitude + longitude
            */

            if (
                lat !== null &&
                lng !== null
            ) {

                const url =
                    "https://www.google.com/maps/dir/?api=1&destination=" +
                    encodeURIComponent(
                        lat + "," + lng
                    );

                window.open(
                    url,
                    "_blank"
                );

                return;

            }


            /*
              Second priority:
              Customer address
            */

            const address =
                getOrderAddress(order);


            if (address) {

                const url =
                    "https://www.google.com/maps/dir/?api=1&destination=" +
                    encodeURIComponent(
                        address
                    );

                window.open(
                    url,
                    "_blank"
                );

                return;

            }


            showToast(
                "Customer address/location is not available yet."
            );

        }


        /* =========================================================
           COMPLETE DELIVERY
        ========================================================== */

        async function completeOrder(orderId) {

            if (
                !confirm(
                    "Are you sure the tiffin has been delivered?"
                )
            ) {

                return;

            }


            showToast(
                "Completing delivery..."
            );


            try {

                const result =
                    await callAPI({

                        action:
                            "completeDelivery",

                        orderId:
                            orderId,

                        deliveryBoyId:
                            currentDeliveryBoy.deliveryBoyId

                    });


                showToast(
                    result.message ||
                    "Delivery completed."
                );


                if (result.success) {

                    stopLocationTracking();

                    await loadAssignedOrders();

                }


            } catch (err) {

                console.error(
                    "Complete delivery error:",
                    err
                );

                showToast(
                    "Unable to complete delivery."
                );

            }

        }


        /* =========================================================
           STOP GPS
        ========================================================== */

        function stopLocationTracking() {

            if (
                locationWatchId !== null
            ) {

                navigator.geolocation.clearWatch(
                    locationWatchId
                );

                locationWatchId =
                    null;

            }


            activeLocationOrderId =
                null;

        }


        /* =========================================================
           ADDRESS HELPER
        ========================================================== */

        function getOrderAddress(order) {

            return (
                order.CustomerAddress ||
                order.UserAddress ||
                order.DeliveryAddress ||
                order.Address ||
                order.address ||
                ""
            ).toString().trim();

        }


        /* =========================================================
           COORDINATE HELPERS
        ========================================================== */

        function getOrderLatitude(order) {

            const value =
                order.CustomerLatitude ??
                order.UserLatitude ??
                order.DeliveryLatitude ??
                null;


            if (
                value === null ||
                value === "" ||
                isNaN(Number(value))
            ) {

                return null;

            }


            return Number(value);

        }


        function getOrderLongitude(order) {

            const value =
                order.CustomerLongitude ??
                order.UserLongitude ??
                order.DeliveryLongitude ??
                null;


            if (
                value === null ||
                value === "" ||
                isNaN(Number(value))
            ) {

                return null;

            }


            return Number(value);

        }


        /* =========================================================
           LOGOUT
        ========================================================== */

        function logoutDeliveryBoy() {

            stopLocationTracking();


            localStorage.removeItem(
                "tiffinhub_delivery_boy"
            );


            currentDeliveryBoy =
                null;

            assignedOrders =
                [];


            document
                .getElementById(
                    "dashboard-page"
                )
                .classList.add("hidden");


            document
                .getElementById(
                    "login-page"
                )
                .classList.remove("hidden");


            document.getElementById(
                "delivery-boy-id"
            ).value = "";

            document.getElementById(
                "delivery-password"
            ).value = "";

        }


        /* =========================================================
           AUTO REFRESH
        ========================================================== */

        setInterval(function () {

            if (
                currentDeliveryBoy &&
                !document
                    .getElementById("dashboard-page")
                    .classList.contains("hidden")
            ) {

                loadAssignedOrders(true);

            }

        }, 15000);


        /* =========================================================
           TOAST
        ========================================================== */

        function showToast(message) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.innerText =
                message;


            toast.style.display =
                "block";


            clearTimeout(
                window.toastTimer
            );


            window.toastTimer =
                setTimeout(
                    function () {

                        toast.style.display =
                            "none";

                    },
                    3000
                );

        }


        /* =========================================================
           SECURITY / DISPLAY HELPERS
        ========================================================== */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeAttr(value) {

            return String(value ?? "")
                .replace(
                    /\\/g,
                    "\\\\"
                )
                .replace(
                    /'/g,
                    "\\'"
                );

        }


        function safeId(value) {

            return String(value ?? "")
                .replace(
                    /[^a-zA-Z0-9_-]/g,
                    "_"
                );

        }


        function formatDate(value) {

            if (!value) {

                return "-";

            }


            const date =
                new Date(value);


            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return String(value);

            }


            return date.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }

    </script>

</body>

</html>
